name: portifolio

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["tools"]
    # Cria o servers.json e o pgpass (senha do banco) antes de iniciar o pgAdmin.
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /tmp/servers.json <<EOF
        {"Servers":{"1":{"Name":"portifolio","Group":"Servers","Host":"db","Port":5432,"MaintenanceDB":"${POSTGRES_DB}","Username":"${POSTGRES_USER}","SSLMode":"prefer","PassFile":"/tmp/pgpass"}}}
        EOF
        printf 'db:5432:*:%s:%s\n' '${POSTGRES_USER}' '${POSTGRES_PASSWORD}' > /tmp/pgpass
        chmod 600 /tmp/pgpass
        exec /entrypoint.sh
    environment:
      # Modo desktop: não pede login. Estes dois valores não são usados para entrar.
      PGADMIN_DEFAULT_EMAIL: pgadmin4@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: pgadmin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  api:
    image: portifolio-api
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    environment:
      PORT: "3001"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: portifolio-web
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  db_data:
  redis_data:
  pgadmin_data: